name: MAHA responsive browser QA
on:
  push:
    branches: [main]
    paths:
      - 'css/studio.css'
      - 'js/room.js'
      - 'js/room-studio.js'
      - 'js/new-home.js'
      - 'js/main.js'
      - 'js/home-art.js'
      - 'css/new-home.css'
      - 'css/remembering-home.css'
      - 'css/atelier.css'
      - 'js/atelier-art.js'
      - 'js/atelier-life.js'
      - 'js/cinematic-home.js'
      - 'css/cinematic-room.css'
      - 'css/physical-room.css'
      - 'css/worlds-director.css'
      - 'js/physical-room-objects.js'
      - 'js/botanical-miniatures.js'
      - 'js/pocket-peek.js'
      - 'js/original-room-art.js'
      - 'content/room-art-direction.json'
      - 'scripts/generate-original-rooms.py'
      - 'assets/rooms/originals/**'
      - 'assets/rooms/**'
      - 'js/memory.js'
      - 'js/portal.js'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'qa/**'
      - '.github/workflows/responsive-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original art generator and twelve prompts (no API cost)
        run: |
          python3 -m py_compile scripts/generate-original-rooms.py
          python3 scripts/generate-original-rooms.py --dry-run
      - name: Install test browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise phone, tablet and desktop layouts
        run: node qa/responsive.mjs
      - name: Save visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maha-responsive-screenshots
          path: qa/screenshots/
          retention-days: 7
