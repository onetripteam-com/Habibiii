name: Package licensed room photography
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-room-photography.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download six credited Unsplash originals
        run: |
          set -euo pipefail
          mkdir -p /tmp/maha-photos assets/rooms
          declare -A PHOTO=(
            [story]=photo-1782346056252-c3699920bf19
            [monsoon]=photo-1598632023082-0431ae33cbfe
            [sunroom]=photo-1600607687939-ce8a6c25118c
            [terracotta]=photo-1618221195710-dd6b41faaea6
            [midnight]=photo-1600210492486-724fe5c67fb0
            [cosmos]=photo-1616594039964-ae9021a400a0
          )
          for key in "${!PHOTO[@]}"; do
            echo "Downloading ${key} via Unsplash free photo download"
            curl --fail --location --silent --show-error --retry 3 --max-time 60 -A 'Mozilla/5.0 (compatible; personal noncommercial art project)' \
              "https://images.unsplash.com/${PHOTO[$key]}?auto=format&fit=crop&w=2200&q=88" -o "/tmp/maha-photos/${key}"
            test "$(stat -c%s "/tmp/maha-photos/${key}")" -gt 50000
            file "/tmp/maha-photos/${key}"
          done
      - name: Optimize source photographs to local WebP assets
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for p in Path('/tmp/maha-photos').iterdir():
              with Image.open(p) as im:
                  im=ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((2048,1536), Image.Resampling.LANCZOS)
                  target=Path('assets/rooms')/(p.name+'.webp')
                  im.save(target,'WEBP',quality=82,method=6)
                  print(target,im.size,target.stat().st_size)
          PY
      - name: Commit local assets
        run: |
          git config user.name "MAHA design bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rooms/*.webp
          if ! git diff --cached --quiet; then git commit -m "Bundle locally hosted licensed photography for the cinematic room"; git push; fi
