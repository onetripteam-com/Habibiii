name: One-time import of approved Kuwait photograph
on:
  push:
    paths:
      - .github/workflows/import-kuwait-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MAHA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --quiet Pillow
      - name: Download approved image and optimize for the room
        env:
          SOURCE_IMAGE: https://d2ol7oe51mr4n9.cloudfront.net/user_3Kr2mB6wawNwljfL4o9CKuS674p/b10de918-c9fa-4a3d-8526-3893df09e83d.png
        run: |
          python - <<'PY'
          import os, io, urllib.request
          from pathlib import Path
          from PIL import Image
          req=urllib.request.Request(os.environ['SOURCE_IMAGE'],headers={'User-Agent':'MAHA-site-assets/1.0'})
          with urllib.request.urlopen(req,timeout=60) as response:
              data=response.read(15_000_001)
          if len(data)>15_000_000: raise ValueError("Source photo too large")
          im=Image.open(io.BytesIO(data))
          im.load()
          if im.size!=(1672,941): raise ValueError(f"Unexpected photo dimensions {im.size}")
          if im.mode!='RGB': im=im.convert('RGB')
          output=Path('assets/rooms/maha-kuwait.webp')
          im.save(output,'WEBP',quality=82,method=6)
          with Image.open(output) as verify:
              verify.verify()
          print(f"Saved {output}, {output.stat().st_size} bytes")
          PY
      - name: Commit image into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rooms/maha-kuwait.webp
          if git diff --cached --quiet; then echo "Already imported"; else
            git commit -m "Add approved Kuwait room photograph at full resolution"
            git push origin HEAD:main
          fi
