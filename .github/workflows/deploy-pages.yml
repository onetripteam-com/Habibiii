name: Deploy MAHA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete static website
        uses: actions/checkout@v4
      - name: Set up Node for QA
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find js -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Run unit and content tests
        run: npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
